name: docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "tools/check-doc-links.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main, pre]
    paths:
      - "**/*.md"
      - "tools/check-doc-links.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  links:
    name: relative links resolve
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check relative Markdown links
        run: python3 tools/check-doc-links.py
