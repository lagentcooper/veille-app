name: ci

on:
  pull_request:
  push:
    branches: [main, pre]

permissions:
  contents: read

jobs:
  check:
    name: lint, types, unit tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # pnpm/action-setup v6.1.0 — pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:isolation
      - run: pnpm typecheck
      # Every workspace package that declares a `test` script, so a new package is covered the
      # day it is added instead of the day someone remembers to list it here.
      - run: pnpm test
      - run: pnpm --filter @veille/web build

      - name: Install the Playwright browser
        run: pnpm --filter @veille/web exec playwright install --with-deps chromium

      - name: End-to-end tests against the production build
        run: pnpm --filter @veille/web test:e2e

      # actions/upload-artifact v7.0.1
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: tmp/playwright/report
          retention-days: 7
